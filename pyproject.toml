[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jeffy"
version = "0.1.0a1"
description = "Pretrained local decision engine: reusable embeddings + small classifiers"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.3.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "scipy>=1.10.0",
    "numpy>=1.24.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
build = ["datasets>=2.14.0"]
dev = ["httpx>=0.24.0"]

[project.scripts]
jeffy-serve = "jeffy.server:main"
jeffy-build = "jeffy.build_pack:main"
jeffy-evaluate = "jeffy.evaluate:main"
jeffy-benchmark = "jeffy.benchmark_page:generate_html"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/jeffy"]
