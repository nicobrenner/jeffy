<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiny Oracle</title>
<style>
  :root {
    --bg: #faf9f7;
    --fg: #1a1a1a;
    --fg-dim: #666;
    --surface: #fff;
    --border: #e0ddd8;
    --accent: #6b5ce7;
    --accent-light: #ede9ff;
    --user-bg: #e8f0fe;
    --oracle-bg: #f3f0ff;
    --mono: 'Courier New', monospace;
    --sans: system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1a1e;
      --fg: #e8e6e1;
      --fg-dim: #999;
      --surface: #242428;
      --border: #3a3a40;
      --accent: #9b8aff;
      --accent-light: #2a2540;
      --user-bg: #1e2a3a;
      --oracle-bg: #252038;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1a1e;
    --fg: #e8e6e1;
    --fg-dim: #999;
    --surface: #242428;
    --border: #3a3a40;
    --accent: #9b8aff;
    --accent-light: #2a2540;
    --user-bg: #1e2a3a;
    --oracle-bg: #252038;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .badge {
    font-size: 11px;
    font-family: var(--mono);
    color: var(--accent);
    background: var(--accent-light);
    padding: 2px 8px;
    border-radius: 10px;
    white-space: nowrap;
  }
  header select {
    font-size: 12px;
    padding: 3px 6px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--fg);
    font-family: var(--sans);
  }
  #status {
    margin-left: auto;
    font-size: 12px;
    color: var(--fg-dim);
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bg);
    border-bottom-right-radius: 4px;
  }
  .msg.oracle {
    align-self: flex-start;
    background: var(--oracle-bg);
    border-bottom-left-radius: 4px;
  }
  .msg.system-msg {
    align-self: center;
    background: none;
    color: var(--fg-dim);
    font-size: 12px;
    font-style: italic;
    max-width: 100%;
    text-align: center;
  }
  .typing { display: inline-flex; align-items: center; height: 1.2em; color: var(--accent); }
  @keyframes blink { 0%,100%{opacity:.2} 50%{opacity:1} }
  .typing i { display:inline-block; width:7px; height:7px; margin:0 2px; border-radius:50%; background:currentColor; opacity:.35; animation: bounce 1.2s infinite ease-in-out; }
  .typing i:nth-child(2) { animation-delay:.15s } .typing i:nth-child(3) { animation-delay:.3s }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:.35} 30%{transform:translateY(-5px);opacity:1} }
  .msg { animation: msgin .22s ease-out; }
  @keyframes msgin { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
  #chat { scroll-behavior: smooth; }

  /* ===== visuals engine: the crawler (first creature of the cast) ===== */
  #chat { position: relative; }
  #crawler { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 5; opacity: 0; transition: opacity .35s; will-change: transform; }
  #crawler.on { opacity: 1; }
  #crawler .leg polyline { stroke: var(--fg); stroke-width: 1.1; stroke-linejoin: round; opacity: .85; }
  #crawler .leg .foot { fill: #ff3b5c; }
  #crawler .chip rect { fill: var(--fg); } #crawler .chip .pin { fill: var(--fg); opacity: .6; } #crawler .chip .die { fill: var(--bg); } #crawler .chip .led { fill: #2b5cff; animation: blink 1.4s infinite; }
  .cr-label { position: absolute; z-index: 7; pointer-events: none; font: 11px/1.3 ui-monospace, Menlo, monospace; background: #2b5cff; color: #fff; padding: 2px 6px; white-space: nowrap; opacity: 0; transition: opacity .25s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .cr-label.on { opacity: 1; }
  .cr-box { position: absolute; z-index: 4; pointer-events: none; border: 1.5px solid #2b5cff; background: rgba(43,92,255,.12); opacity: 0; transition: opacity .25s, transform .6s ease-in, left .6s ease-in, top .6s ease-in; }
  .cr-box.on { opacity: 1; }
  .cr-scan { position: absolute; z-index: 4; pointer-events: none; border: 1px dashed rgba(140,140,160,.9); animation: msgin .2s ease-out; }
  .cr-scanlabel { position: absolute; z-index: 7; pointer-events: none; font: 10px/1.2 ui-monospace, Menlo, monospace; background: rgba(90,90,110,.9); color: #fff; padding: 1px 4px; white-space: nowrap; animation: msgin .2s ease-out; }
  .cr-scan.lock { border: 1.5px solid #ff7a1a; background: rgba(255,122,26,.15); animation: lockpulse .5s 3; }
  .cr-scanlabel.lock { background: #ff7a1a; font-weight: 600; }
  @keyframes lockpulse { 0%,100%{ box-shadow: 0 0 0 0 rgba(255,122,26,.6) } 50%{ box-shadow: 0 0 0 5px rgba(255,122,26,0) } }
  .cr-drop { align-self: flex-start; font: 11px/1.4 ui-monospace, Menlo, monospace; color: var(--fg-dim); border-left: 2px solid #2b5cff; padding: 2px 8px; margin: -4px 0 0 6px; animation: msgin .3s ease-out; }
  #input-area {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  #input-area input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--fg);
    font-size: 14px;
    font-family: var(--sans);
    outline: none;
  }
  #input-area input:focus { border-color: var(--accent); }
  #input-area button {
    padding: 10px 20px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    font-family: var(--sans);
  }
  #input-area button:disabled {
    opacity: .5;
    cursor: not-allowed;
  }
  footer {
    padding: 8px 20px;
    text-align: center;
    font-size: 11px;
    color: var(--fg-dim);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  footer a { color: var(--accent); text-decoration: none; }
  #suggestions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    padding: 0 20px 8px;
  }
  .suggestion {
    font-size: 12px;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--surface);
    color: var(--fg-dim);
    cursor: pointer;
    transition: border-color .15s;
  }
  .suggestion:hover { border-color: var(--accent); color: var(--fg); }
</style>
</head>
<body>

<header>
  <h1>Tiny Oracle</h1>
  <span class="badge" id="badge">loading</span>
  <select id="model-select" title="Model version"></select>
  <select id="sampler-select" title="Sampling recipe">
    <option value="sched">T0.3 opener → T0.5 + penalties</option>
    <option value="recipe03">T0.3 + penalties</option>
    <option value="recipe">T0.5 + penalties</option>
    <option value="old">T0.8 (old demo)</option>
  </select>
  <label style="font-size:12px;color:var(--fg-dim);display:flex;align-items:center;gap:4px"><input type="checkbox" id="prime-check"> prime</label>
  <label style="font-size:12px;color:var(--fg-dim);display:flex;align-items:center;gap:4px" title="Click any Oracle reply to rewrite it; rewrites are saved as training examples"><input type="checkbox" id="teachCheck"> teach</label>
  <span id="teachCount" style="font-size:12px;color:var(--fg-dim)"></span>
  <button id="teachExport" class="suggestion" style="font-size:12px" title="Download corrections.jsonl">export</button>
  <button id="teachClear" class="suggestion" style="font-size:12px" title="Delete saved corrections">clear</button>
  <button id="engExport" class="suggestion" style="font-size:12px" title="Download engagement.json: turns per conversation, reply-after-turn rate, time to reply">engagement</button>
  <label style="font-size:12px;color:var(--fg-dim);display:flex;align-items:center;gap:4px" title="The Oracle's pet crawler lives in the chat"><input type="checkbox" id="crawlerCheck" checked> crawler</label>
  <span id="status">Loading model...</span>
</header>

<div id="chat">
  <div class="msg system-msg">Loading Tiny Oracle into your browser...</div>
</div>

<div id="suggestions"></div>

<div id="input-area">
  <input id="user-input" type="text" placeholder="Say something..." disabled>
  <button id="send-btn" disabled>Send</button>
</div>

<footer>
  <span id="footer-text">Running entirely in your browser &middot; no server, no API calls</span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
<script>
(function() {
  // Any uncaught error becomes visible instead of a blank page
  window.addEventListener('error', e => { const st = document.getElementById('status'); if (st) st.textContent = 'Error: ' + e.message; const c = document.getElementById('chat'); if (c) { const d = document.createElement('div'); d.className = 'msg system-msg'; d.textContent = 'Script error: ' + e.message + ' (' + (e.filename || '').split('/').pop() + ':' + e.lineno + ')'; c.appendChild(d); } });
  window.addEventListener('unhandledrejection', e => { const st = document.getElementById('status'); if (st) st.textContent = 'Error: ' + (e.reason && e.reason.message || e.reason); });
  const SYSTEM_PROMPT = `You are Tiny Oracle, a mass of 2 million parameters running on the user's device. You have strong opinions and very limited knowledge. You are self-aware about your size and find it amusing. Keep responses short — you only have 2M parameters to work with.`;
  // Hand-written priming exchange (the old v2 demo always used it; here it is a checkbox so models can be compared with and without)
  const PRIME = [
    ["Hey, what are you?", "I'm Tiny Oracle. 2 million parameters of questionable wisdom, running right here in your browser. I fit in 4 megabytes. A fruit fly has more neurons than I have parameters."],
    ["That's not much", "I know. And yet here I am, boiling with opinions."],
  ];
  const MAX_NEW_TOKENS = 60;
  const MAX_CONTEXT = 256;
  const UNK_ID = 1, EOS_ID = 3;

  // Model registry. format 'tags' = <|system|>/<|user|>/<|oracle|> (v2 tokenizer); 'plain' = System:/User:/Oracle: (TinyStories tokenizer)
  const MODELS = {
    v2_grown_ct2_int8: { label: '★ Nico\'s pick · Oct 26 18:17 · grown 8.5M · admit act (plan token, picks its own act)', file: 'oracle_v2_grown_ct2_int8.onnx', tokenizer: 'tokenizer_chat_v2.json', format: 'tags', badge: '8.5M params (grown from v2) · 11 MB int8', size: '11 MB', old: false },
    v3b_scratch_int8: { label: 'v3b: same as v3 but names re-anonymised (copy-from-context) + self-address fix (2.7M, int8)', file: 'oracle_v3b_scratch_int8.onnx', tokenizer: 'tokenizer_chat_v2.json', format: 'tags', badge: '2.7M params · 4 MB int8', size: '4 MB' },
    v3_scratch_int8: { label: 'Oct 26 17:04 · v3 2.7M · from scratch, fixed corpus', file: 'oracle_v3_scratch_int8.onnx', tokenizer: 'tokenizer_chat_v2.json', format: 'tags', badge: '2.7M params · 4 MB int8', size: '4 MB', old: false },
    v2_grown_recover4x8_int8: { label: 'v2 GROWN to 8.5M, per conversation + 120 push-back RECOVERIES x4 (8.5M, int8)', file: 'oracle_v2_grown_recover4x8_int8.onnx', tokenizer: 'tokenizer_chat_v2.json', format: 'tags', badge: '8.5M params (grown from v2) · 11 MB int8', size: '11 MB' },
    v2_grown_recovermt2x8_f32: { label: 'Oct 26 20:49 · grown 8.5M · 770 recoveries (DAgger) + bible — f32 (34 MB)', file: 'oracle_v2_grown_recovermt2x8_f32.onnx', tokenizer: 'tokenizer_chat_v2.json', format: 'tags', badge: '8.5M params · 34 MB f32', size: '34 MB', old: false },
    v2_grown_recovermt2x8_int8: { label: 'v2 GROWN to 8.5M, per conversation + 660 multi-turn + 120 push-back RECOVERIES (DAgger, loss only on the expert turn) (8.5M, int8)', file: 'oracle_v2_grown_recovermt2x8_int8.onnx', tokenizer: 'tokenizer_chat_v2.json', format: 'tags', badge: '8.5M params (grown from v2) · 11 MB int8', size: '11 MB' },
    v2_grown_recovermt8_int8: { label: 'v2 GROWN to 8.5M, per conversation + 660 multi-turn + 120 push-back RECOVERIES (DAgger) (8.5M, int8)', file: 'oracle_v2_grown_recovermt8_int8.onnx', tokenizer: 'tokenizer_chat_v2.json', format: 'tags', badge: '8.5M params (grown from v2) · 11 MB int8', size: '11 MB' },
    v2_grown_recover8_int8: { label: 'v2 GROWN to 8.5M, per conversation + 120 push-back RECOVERIES (8.5M, int8)', file: 'oracle_v2_grown_recover8_int8.onnx', tokenizer: 'tokenizer_chat_v2.json', format: 'tags', badge: '8.5M params (grown from v2) · 11 MB int8', size: '11 MB' },
    v2_grown_conv8_int8: { label: 'Oct 26 15:29 · grown 8.5M · trained per conversation', file: 'oracle_v2_grown_conv8_int8.onnx', tokenizer: 'tokenizer_chat_v2.json', format: 'tags', badge: '8.5M params (grown from v2) · 11 MB int8', size: '11 MB', old: false },
    v2_grown_life8b_int8: { label: 'Oct 26 13:35 · grown 8.5M · chunked, all fixes + Nico lines', file: 'oracle_v2_grown_life8b_int8.onnx', tokenizer: 'tokenizer_chat_v2.json', format: 'tags', badge: '8.5M params (grown from v2) · 11 MB int8', size: '11 MB', old: false },
    v2_life8b_int8: { label: 'Oct 26 13:35 · 2.7M control · all fixes (not grown)', file: 'oracle_v2_life8b_int8.onnx', tokenizer: 'tokenizer_chat_v2.json', format: 'tags', badge: '2.7M params · 4 MB int8', size: '4 MB', old: false },
    v2_grown_life8_int8: { label: 'Oct 26 12:10 · grown 8.5M · 8 ep, names + hobbies fixed', file: 'oracle_v2_grown_life8_int8.onnx', tokenizer: 'tokenizer_chat_v2.json', format: 'tags', badge: '8.5M params (grown from v2) · 11 MB int8', size: '11 MB', old: false },
    v2_life8_int8: { label: 'Oct 26 12:09 · 2.7M control · 8 ep, names + hobbies fixed', file: 'oracle_v2_life8_int8.onnx', tokenizer: 'tokenizer_chat_v2.json', format: 'tags', badge: '2.7M params · 4 MB int8', size: '4 MB', old: false },
    v2_grown_life3_int8: { label: 'Oct 26 11:48 · grown 8.5M · 3 ep, names + hobbies fixed', file: 'oracle_v2_grown_life3_int8.onnx', tokenizer: 'tokenizer_chat_v2.json', format: 'tags', badge: '8.5M params (grown from v2) · 11 MB int8', size: '11 MB', old: false },
    v2_life3_int8: { label: 'Oct 26 11:47 · 2.7M control · 3 ep, names + hobbies fixed', file: 'oracle_v2_life3_int8.onnx', tokenizer: 'tokenizer_chat_v2.json', format: 'tags', badge: '2.7M params · 4 MB int8', size: '4 MB', old: false },
    v2_grown_fixname3_int8: { label: 'Oct 26 10:53 · grown 8.5M · 3 ep, Oracle named', file: 'oracle_v2_grown_fixname3_int8.onnx', tokenizer: 'tokenizer_chat_v2.json', format: 'tags', badge: '8.5M params (grown from v2) · 11 MB int8', size: '11 MB', old: false },
    v2_fixname3_int8: { label: 'Oct 26 10:52 · 2.7M control · 3 ep, Oracle named', file: 'oracle_v2_fixname3_int8.onnx', tokenizer: 'tokenizer_chat_v2.json', format: 'tags', badge: '2.7M params · 4 MB int8', size: '4 MB', old: false },
    v2_grown_fix3_int8: { label: 'Oct 26 10:42 · grown 8.5M · 3 ep, placeholders fixed', file: 'oracle_v2_grown_fix3_int8.onnx', tokenizer: 'tokenizer_chat_v2.json', format: 'tags', badge: '8.5M params (grown from v2) · 11 MB int8', size: '11 MB', old: false },
    v2_fix3_int8: { label: 'Oct 26 10:42 · 2.7M control · 3 ep, placeholders fixed', file: 'oracle_v2_fix3_int8.onnx', tokenizer: 'tokenizer_chat_v2.json', format: 'tags', badge: '2.7M params · 4 MB int8', size: '4 MB', old: false },
    v2_grown_8m_int8: { label: 'Oct 26 10:27 · grown 8.5M · 3 ep on v2 data', file: 'oracle_v2_grown_8m_int8.onnx', tokenizer: 'tokenizer_chat_v2.json', format: 'tags', badge: '8.5M params (grown from v2) · 11 MB int8', size: '11 MB', old: false },
    v2_plus3_int8: { label: 'Oct 26 10:26 · 2.7M control · 3 ep on v2 data', file: 'oracle_v2_plus3_int8.onnx', tokenizer: 'tokenizer_chat_v2.json', format: 'tags', badge: '2.7M params · 4 MB int8', size: '4 MB', old: false },
    m2_grown_persona2_int8: { label: 'Oct 26 09:40 · other lineage · 2.0M grown to 8.5M', file: 'oracle_2m_grown_persona2_int8.onnx', tokenizer: 'tokenizer_tinystories.json', format: 'plain', badge: '8.5M params (grown from 2.0M) · 11 MB int8', size: '11 MB', old: true },
    m2_persona2_plus3_int8: { label: 'Oct 26 09:40 · other lineage · 2.0M control', file: 'oracle_2m_persona2_plus3_int8.onnx', tokenizer: 'tokenizer_tinystories.json', format: 'plain', badge: '2.0M params · 3 MB int8', size: '3 MB', old: true },
    m2_persona2_int8: { label: 'Oct 25 23:43 · other lineage · 2.0M TinyStories', file: 'oracle_2m_persona2_int8.onnx', tokenizer: 'tokenizer_tinystories.json', format: 'plain', badge: '2.0M params · 2.6 MB int8', size: '3 MB', old: true },
    conv_persona2_int8: { label: 'Oct 25 22:20 · other lineage · 8.5M TinyStories persona2', file: 'oracle_conv_persona2_int8.onnx', tokenizer: 'tokenizer_tinystories.json', format: 'plain', badge: '8.5M params · 11 MB int8', size: '11 MB', old: true },
    conv_persona_int8: { label: 'Oct 25 21:30 · other lineage · 8.5M TinyStories persona', file: 'oracle_conv_persona_int8.onnx', tokenizer: 'tokenizer_tinystories.json', format: 'plain', badge: '8.5M params · 11 MB int8', size: '11 MB', old: true },
    v7a_conv_fix_int8: { label: 'Oct 25 17:56 · other lineage · 8.5M v7a fixed data', file: 'oracle_v7a_conv_fix_int8.onnx', tokenizer: 'tokenizer_tinystories.json', format: 'plain', badge: '8.5M params · 11 MB int8', size: '11 MB', old: true },
    v7a_conv_int8: { label: 'Oct 25 13:44 · other lineage · 8.5M v7a converged', file: 'oracle_v7a_conv_int8.onnx', tokenizer: 'tokenizer_tinystories.json', format: 'plain', badge: '8.5M params · 11 MB int8', size: '11 MB', old: true },
    v7a_conv_f32: { label: 'Oct 25 13:43 · other lineage · 8.5M v7a f32', file: 'oracle_v7a_conv_f32.onnx', tokenizer: 'tokenizer_tinystories.json', format: 'plain', badge: '8.5M params · 43 MB f32', size: '43 MB', old: true },
    v2: { label: 'Oct 23 20:14 · v2 original 2.7M (the reference)', file: 'oracle_v2.onnx', tokenizer: 'tokenizer_chat_v2.json', format: 'tags', badge: '2.7M params · 15 MB', size: '15 MB', old: true },
  };
  const SAMPLERS = {
    sched: { temperature: 0.3, topK: 40, repPenalty: 1.3, noRepeatNgram: 3, laterTemperature: 0.5 }, // T0.3 on the opener, T0.5 once there is history (harness ablation 2026-10-26: drift 25 -> 17/96)
    recipe03: { temperature: 0.3, topK: 40, repPenalty: 1.3, noRepeatNgram: 3 }, // best on canonical openers for the persona models (blind, 2026-10-25)
    recipe: { temperature: 0.5, topK: 40, repPenalty: 1.3, noRepeatNgram: 3 },   // blind-graded recipe (2026-10-25)
    old: { temperature: 0.8, topK: 40, repPenalty: 1.0, noRepeatNgram: 0 },     // the old demo's setting
  };
  const SUGGESTIONS = ["What are you?", "How smart are you?", "Tell me something interesting", "What's your opinion on AI?", "What can you do in 4 megabytes?"];

  let session = null, tokenizer = null, model = null, generating = false, conversationIds = [], transcript = [];
  let corrections = []; try { corrections = JSON.parse(localStorage.getItem('tinyoracle.corrections') || '[]'); } catch (e) {}
  // engagement log: implicit feedback only (no questions asked). Events: load, user, oracle, reset. Turns per conversation, reply-after-turn
  // rate and inter-message time are computed from these at export time.
  let events = []; try { events = JSON.parse(localStorage.getItem('tinyoracle.events') || '[]'); } catch (e) {}
  let convId = Date.now();
  function logEvent(type, extra) { events.push({ t: Date.now(), conv: convId, model: modelSel && modelSel.value, type, ...(extra || {}) }); if (events.length > 5000) events = events.slice(-5000); try { localStorage.setItem('tinyoracle.events', JSON.stringify(events)); } catch (e) {} }

  const chatEl = document.getElementById('chat');
  const inputEl = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const statusEl = document.getElementById('status');
  const suggestionsEl = document.getElementById('suggestions');
  const modelSel = document.getElementById('model-select');
  const samplerSel = document.getElementById('sampler-select');
  const primeCheck = document.getElementById('prime-check');
  const badgeEl = document.getElementById('badge');

  // ===================== BYTE-LEVEL BPE TOKENIZER =====================
  function buildByteEncoder() {
    const bs = [];
    for (let i = 33; i <= 126; i++) bs.push(i);
    for (let i = 161; i <= 172; i++) bs.push(i);
    for (let i = 174; i <= 255; i++) bs.push(i);
    const cs = [...bs];
    let n = 0;
    for (let b = 0; b < 256; b++) if (!bs.includes(b)) { bs.push(b); cs.push(256 + n); n++; }
    const encoder = {}, decoder = {};
    for (let i = 0; i < bs.length; i++) { encoder[bs[i]] = String.fromCharCode(cs[i]); decoder[String.fromCharCode(cs[i])] = bs[i]; }
    return { encoder, decoder };
  }

  class BPETokenizer {
    constructor(tokenizerJson) {
      const m = tokenizerJson.model;
      this.vocab = m.vocab; this.invVocab = {};
      for (const [tok, id] of Object.entries(this.vocab)) this.invVocab[id] = tok;
      this.merges = m.merges.map(x => { const p = typeof x === 'string' ? x.split(' ') : x; return [p[0], p[1]]; });
      this.mergeRanks = {};
      for (let i = 0; i < this.merges.length; i++) this.mergeRanks[this.merges[i][0] + ' ' + this.merges[i][1]] = i;
      this.addedTokens = {};
      for (const t of tokenizerJson.added_tokens || []) this.addedTokens[t.content] = t.id;
      const { encoder, decoder } = buildByteEncoder();
      this.byteEncoder = encoder; this.byteDecoder = decoder;
      this.pat = /'s|'t|'re|'ve|'m|'ll|'d| ?\p{L}+| ?\p{N}+| ?[^\s\p{L}\p{N}]+|\s+/gu;
    }
    bpe(token) {
      let word = token.split('');
      if (word.length <= 1) return word;
      while (true) {
        let bestPair = null, bestRank = Infinity;
        for (let i = 0; i < word.length - 1; i++) {
          const rank = this.mergeRanks[word[i] + ' ' + word[i + 1]];
          if (rank !== undefined && rank < bestRank) { bestRank = rank; bestPair = [word[i], word[i + 1]]; }
        }
        if (!bestPair) break;
        const merged = bestPair[0] + bestPair[1], newWord = [];
        let i = 0;
        while (i < word.length) {
          if (i < word.length - 1 && word[i] === bestPair[0] && word[i + 1] === bestPair[1]) { newWord.push(merged); i += 2; }
          else { newWord.push(word[i]); i++; }
        }
        word = newWord;
        if (word.length === 1) break;
      }
      return word;
    }
    encode(text) {
      const keys = Object.keys(this.addedTokens);
      const specialRe = new RegExp('(' + keys.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')');
      const ids = [];
      for (const seg of text.split(specialRe)) {
        if (seg === '') continue;
        if (this.addedTokens[seg] !== undefined) { ids.push(this.addedTokens[seg]); continue; }
        const matches = seg.match(this.pat);
        if (!matches) continue;
        for (const word of matches) {
          const encoded = Array.from(new TextEncoder().encode(word)).map(b => this.byteEncoder[b]).join('');
          for (const t of this.bpe(encoded)) { const id = this.vocab[t]; ids.push(id !== undefined ? id : UNK_ID); }
        }
      }
      return ids;
    }
    decode(ids) {
      const text = ids.map(id => this.invVocab[id] || '').filter(t => !t.startsWith('<') || !t.endsWith('>')).join('');
      const bytes = Array.from(text).map(c => this.byteDecoder[c]).filter(b => b !== undefined);
      return new TextDecoder('utf-8', { fatal: false }).decode(new Uint8Array(bytes));
    }
  }

  // ===================== FORMAT =====================
  function fmtSystem() { return model.format === 'plain' ? 'System: ' + SYSTEM_PROMPT : '<|system|> ' + SYSTEM_PROMPT; }
  function fmtUserTurn(text) { return model.format === 'plain' ? '\nUser: ' + text + '\nOracle:' : '\n<|user|> ' + text + '\n<|oracle|>'; }
  function fmtOracleText(text) { return ' ' + text; }
  function buildPrime() {
    let t = fmtSystem();
    if (primeCheck.checked) for (const [u, o] of PRIME) t += fmtUserTurn(u) + fmtOracleText(o);
    return t;
  }

  // ===================== INFERENCE =====================
  async function generate(inputIds, onToken) {
    const S = { ...SAMPLERS[samplerSel.value] };
    if (transcript.length >= 2 && S.laterTemperature) S.temperature = S.laterTemperature;
    let ids = inputIds.slice(-MAX_CONTEXT);
    const generated = [];
    // cross-turn memory of what the Oracle already said in this conversation (so stock lines and questions do not repeat turn after turn)
    const priorIds = transcript.filter(m => m.role === 'oracle').flatMap(m => tokenizer.encode(' ' + m.text));
    const priorSet = new Set(priorIds), priorGrams = new Set();
    for (let j = 0; j + 3 <= priorIds.length; j++) priorGrams.add(priorIds[j] + ',' + priorIds[j + 1] + ',' + priorIds[j + 2]);
    const crossPenalty = S.repPenalty !== 1.0 ? 1 + (S.repPenalty - 1) * 0.5 : 1.0;   // half-strength across turns
    for (let i = 0; i < MAX_NEW_TOKENS; i++) {
      const input = new ort.Tensor('int64', BigInt64Array.from(ids.map(BigInt)), [1, ids.length]);
      const results = await session.run({ input_ids: input });
      const logits = results.logits.data, vocabSize = results.logits.dims[2];
      const last = new Float32Array(vocabSize), off = (ids.length - 1) * vocabSize;
      for (let v = 0; v < vocabSize; v++) last[v] = logits[off + v];
      if (S.repPenalty !== 1.0) for (const t of new Set(generated)) last[t] = last[t] > 0 ? last[t] / S.repPenalty : last[t] * S.repPenalty;
      if (crossPenalty !== 1.0) for (const t of priorSet) if (!generated.includes(t)) last[t] = last[t] > 0 ? last[t] / crossPenalty : last[t] * crossPenalty;
      if (generated.length >= 2) { const a = generated[generated.length - 2], b2 = generated[generated.length - 1]; for (const g of priorGrams) { const [x, y, z] = g.split(',').map(Number); if (x === a && y === b2) last[z] = -Infinity; } }
      if (S.noRepeatNgram > 0 && generated.length >= S.noRepeatNgram - 1) {
        const n = S.noRepeatNgram, tail = generated.slice(generated.length - (n - 1));
        for (let j = 0; j + n <= generated.length; j++) {
          let match = true;
          for (let q = 0; q < n - 1; q++) if (generated[j + q] !== tail[q]) { match = false; break; }
          if (match) last[generated[j + n - 1]] = -Infinity;
        }
      }
      last[UNK_ID] = -Infinity;
      for (let v = 0; v < vocabSize; v++) last[v] /= S.temperature;
      const indexed = Array.from(last).map((v, k) => [v, k]).sort((a, b) => b[0] - a[0]).slice(0, S.topK);
      const maxVal = indexed[0][0];
      let sumExp = 0;
      for (const it of indexed) { it[0] = Math.exp(it[0] - maxVal); sumExp += it[0]; }
      let r = Math.random() * sumExp, nextId = indexed[0][1];
      for (const [p, k] of indexed) { r -= p; if (r <= 0) { nextId = k; break; } }
      const tok = tokenizer.invVocab[nextId] || '';
      if (nextId === EOS_ID || tok === '<|user|>' || tok === '<|system|>' || tok === '<eos>') break;
      ids.push(nextId); generated.push(nextId);
      if (model.format === 'plain' && tokenizer.decode(generated).includes('\n')) break;
      if (onToken) { onToken(tokenizer.decode(generated)); await new Promise(r => setTimeout(r, 0)); }
      if (ids.length > MAX_CONTEXT) ids = ids.slice(ids.length - MAX_CONTEXT);
    }
    return generated;
  }


  // ===================== DETECTOR (what the crawler sees) =====================
  // Swappable word classifier for the creatures. v1 = lexicons + rules, fast and local; the interface (classify(word, context) ->
  // {label, score}) is what a trained classifier replaces later. Labels are the Oracle's world categories.
  const Detector = (() => {
    const L = {
      PERSONA: 'parameters parameter megabytes megabyte browser tab tokenizer tokens token model models weights epoch epochs checkpoint crawler cursor sampler context window oracle tiny autocomplete predict predicting words word neurons gpu server cloud internet',
      FEELING: 'sad happy tired lonely bored anxious scared afraid angry excited glad sorry love hate worried stressed nervous calm fine okay great terrible awful amazing fun funny weird creepy cute nice lovely',
      PLACE: 'home house room school work office city town country beach park gym kitchen bed garden street canada paris london japan arctic oregon',
      BEING: 'cat dog pet puppy kitten spider friend friends family mom dad sister brother wife husband kids people person human humans baby parrot bird fish',
      TIME: 'today tomorrow yesterday morning night evening week weekend year years monday friday later now soon hour minute',
      FOOD: 'pizza coffee tea water beer wine pineapple cheese bread rice chicken lunch dinner breakfast recipe cooking',
      QUESTION: 'what why how when where who which'
    };
    const lex = {}; for (const k in L) for (const w of L[k].split(' ')) lex[w] = k;
    function classify(word, context) {
      const w = word.toLowerCase().replace(/[^a-z']/g, '');
      if (lex[w]) return { label: lex[w], score: lex[w] === 'PERSONA' ? 0.93 : 0.82 + (w.length % 3) * 0.04 };
      if (/^\d+$/.test(word)) return { label: 'NUMBER', score: 0.9 };
      if (/^[A-Z][a-z]{2,}$/.test(word) && !/^(I|The|Yes|No|And|But|Well|Hi|Hey|Hello|Thanks|Oh|Ok|Okay|So|That|This|It|What|Why|How|When|Where|Who)$/.test(word)) return { label: 'NAME', score: 0.78 };
      if (/(ing|ed)$/.test(w) && w.length > 5) return { label: 'ACTION', score: 0.62 + Math.min(0.2, (w.length - 6) * 0.03) };
      if (/(ly)$/.test(w) && w.length > 5) return { label: 'MANNER', score: 0.55 };
      if (/(ness|tion|ment|ity|ance|ence)$/.test(w)) return { label: 'IDEA', score: 0.66 };
      if (w.length >= 8) return { label: 'THING', score: 0.5 + Math.min(0.25, (w.length - 8) * 0.04) };
      return { label: 'WORD', score: 0.25 + Math.min(0.2, w.length * 0.03) };
    }
    return { classify };
  })();

  // ===================== VISUALS ENGINE: THE CRAWLER =====================
  // The Oracle's pet from the world bible, as a creature in the chat: a small microchip body on eight long jointed legs. It steps (alternating
  // tripod gait, body bob) rather than glides. Events: after an Oracle reply it may come out, walk to a word, box + label it (CRAWLER/01),
  // bag it, leave; a little later it comes back and drops a note. Creature interface: on({type}) with oracle/user/idle/reset.
  const crawlerCheck = document.getElementById('crawlerCheck');
  const Crawler = (() => {
    const W = 110, H = 70, CX = 55, CY = 38;   // svg box; chip centre
    const el = document.createElement('div'); el.id = 'crawler'; el.style.width = W + 'px'; el.style.height = H + 'px';
    // legs: hip on the chip edge, knee high and far, foot on the ground line; 4 per side
    const legDefs = [...Array(8)].map((_, i) => { const side = i < 4 ? -1 : 1, k = i % 4; return { side, hipX: CX + side * 9, hipY: CY - 6 + k * 4, kneeX: CX + side * (26 + k * 6), kneeY: CY - 22 + k * 3, footX: CX + side * (40 + k * 8), footY: CY + 20 + (k % 2) * 3 }; });
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
      ${legDefs.map((d, i) => `<g class="leg" data-i="${i}" style="transform-origin:${d.hipX}px ${d.hipY}px"><polyline points="${d.hipX},${d.hipY} ${d.kneeX},${d.kneeY} ${d.footX},${d.footY}" fill="none"/><circle class="foot" cx="${d.footX}" cy="${d.footY}" r="1.8"/></g>`).join('')}
      <g class="chip"><rect x="${CX - 9}" y="${CY - 9}" width="18" height="18" rx="2"/>${[-6, -2, 2, 6].map(o => `<rect class="pin" x="${CX + o - 1}" y="${CY - 12}" width="2" height="3"/><rect class="pin" x="${CX + o - 1}" y="${CY + 9}" width="2" height="3"/>`).join('')}<rect class="die" x="${CX - 4}" y="${CY - 4}" width="8" height="8"/><rect class="led" x="${CX + 5}" y="${CY - 7}" width="2" height="2"/></g></svg>`;
    const label = document.createElement('div'); label.className = 'cr-label';
    const box = document.createElement('div'); box.className = 'cr-box';
    let x = -W, y = 20, busy = false, bag = [], visits = 0, legs = null;
    function mount() { if (!el.isConnected) { chatEl.appendChild(el); chatEl.appendChild(label); chatEl.appendChild(box); legs = Array.from(el.querySelectorAll('.leg')); } }
    function place(px, py, bob) { x = px; y = py; el.style.transform = `translate(${px - CX}px, ${py - CY + (bob || 0)}px)`; }
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    function pose(t, moving) {   // alternating tripod gait: group A = legs 0,2,5,7; group B = 1,3,4,6. Each leg swings about its hip and lifts on its swing phase.
      for (const g of legs) { const i = +g.dataset.i, groupA = [0, 2, 5, 7].includes(i), ph = t * 9 + (groupA ? 0 : Math.PI); const sw = moving ? Math.sin(ph) : 0, lift = moving ? Math.max(0, Math.sin(ph)) : 0; const side = legDefs[i].side; g.style.transform = `rotate(${sw * 9 * side}deg) translateY(${-lift * 3}px)`; }
    }
    function walkTo(tx, ty, speed = 120) {   // stepping animation on rAF (no CSS glide): slight lateral wobble, body bob with the gait
      return new Promise(res => { const x0 = x, y0 = y, d = Math.hypot(tx - x0, ty - y0), dur = Math.max(300, d / speed * 1000); let t0 = null;
        const frame = ts => { if (!t0) t0 = ts; const u = Math.min(1, (ts - t0) / dur), tt = (ts - t0) / 1000; const wob = Math.sin(tt * 6) * 2 * (1 - u); place(x0 + (tx - x0) * u, y0 + (ty - y0) * u + wob, Math.sin(tt * 18) * 1.2); pose(tt, true); if (u < 1) requestAnimationFrame(frame); else { pose(tt, false); res(); } };
        requestAnimationFrame(frame); });
    }
    function wordBoxes() {   // every word in the last three bubbles with its on-screen box (relative to #chat) and detector verdict
      const msgs = Array.from(chatEl.querySelectorAll('.msg.oracle, .msg.user')).slice(-3).filter(m => !m.querySelector('textarea'));
      const out = []; const base = chatEl.getBoundingClientRect();
      for (const m of msgs) { const walker = document.createTreeWalker(m, NodeFilter.SHOW_TEXT); let n; while ((n = walker.nextNode())) { const t = n.textContent; const re = /[A-Za-z][A-Za-z']{3,}/g; let mm;
        while ((mm = re.exec(t))) { const range = document.createRange(); range.setStart(n, mm.index); range.setEnd(n, mm.index + mm[0].length); const r = range.getBoundingClientRect();
          const v = Detector.classify(mm[0], t); out.push({ word: mm[0], left: r.left - base.left + chatEl.scrollLeft, top: r.top - base.top + chatEl.scrollTop, w: r.width, h: r.height, label: v.label, score: v.score }); } } }
      return out;
    }
    const scans = []; function scanLabel(wb, cls) {   // a detector box + label over a word (grey while scanning, orange when locked)
      const bx = document.createElement('div'); bx.className = 'cr-scan ' + cls; bx.style.left = wb.left - 2 + 'px'; bx.style.top = wb.top - 1 + 'px'; bx.style.width = wb.w + 4 + 'px'; bx.style.height = wb.h + 2 + 'px';
      const lb = document.createElement('div'); lb.className = 'cr-scanlabel ' + cls; lb.textContent = `${wb.label} ${wb.score.toFixed(2)}`; lb.style.left = wb.left + 'px'; lb.style.top = wb.top - 16 + 'px';
      chatEl.appendChild(bx); chatEl.appendChild(lb); scans.push(bx, lb); return [bx, lb];
    }
    function clearScans() { for (const e of scans.splice(0)) e.remove(); }
    async function visit() {
      if (busy || !crawlerCheck.checked) return; busy = true; mount(); visits++;
      const all = wordBoxes(); if (!all.length) { busy = false; return; }
      el.classList.add('on'); place(-W, all[0].top + 40);
      await walkTo(Math.min(140, chatEl.clientWidth / 3), all[0].top + 30);   // comes in and looks around
      const seen = all.slice().sort(() => Math.random() - 0.5).slice(0, Math.min(6, all.length));   // scans a handful of words, detector labels on each
      for (const wb of seen) { scanLabel(wb, 'scan'); await sleep(260); }
      await sleep(500);
      const w = seen.reduce((a, b) => (b.score > a.score ? b : a));   // locks onto the best detection
      clearScans(); const [lbx, llb] = scanLabel(w, 'lock'); logEvent('crawler_lock', { word: w.word, label: w.label, score: w.score });
      await sleep(900);
      await walkTo(w.left + w.w / 2, w.top + w.h + 26, 220);   // goes to get it, faster
      clearScans();
      box.style.left = w.left - 2 + 'px'; box.style.top = w.top - 1 + 'px'; box.style.width = w.w + 4 + 'px'; box.style.height = w.h + 2 + 'px'; box.style.transform = ''; box.classList.add('on');
      label.textContent = `CRAWLER/01  ${w.label} · ${w.word.toUpperCase()}`; label.style.left = w.left + 'px'; label.style.top = w.top - 22 + 'px'; label.classList.add('on');
      logEvent('crawler', { word: w.word, label: w.label, visit: visits });
      await sleep(1600);
      label.classList.remove('on'); bag.push(w.word);
      box.style.left = (x - 4) + 'px'; box.style.top = (y - 4) + 'px'; box.style.transform = 'scale(.15)';   // the word goes in the bag
      await sleep(600); box.classList.remove('on');
      await walkTo(chatEl.clientWidth + W, y - 20 + Math.random() * 40, 160); el.classList.remove('on'); busy = false;
      setTimeout(returnWithDrop, 9000 + Math.random() * 12000);   // it always comes back, 9–21 s later
    }
    async function returnWithDrop() {
      if (!crawlerCheck.checked || !bag.length) return; if (busy) { setTimeout(returnWithDrop, 4000); return; } busy = true; mount();
      const last = chatEl.querySelector('.msg:last-of-type'); const ty = last ? last.offsetTop + last.offsetHeight + 30 : chatEl.scrollHeight - 40;
      el.classList.add('on'); place(chatEl.clientWidth + W, ty); await walkTo(90, ty, 140);
      const words = bag.splice(0, bag.length); const notes = [`found this: ${words.join(', ')}. no idea what it means`, `brought back: ${words.join(', ')}. you said these. I kept them`, `${words.join(' / ')} — filed under things humans say`, `dropped ${words.length === 1 ? 'it' : 'them'} here: ${words.join(', ')}. smelled important`];
      const d = document.createElement('div'); d.className = 'cr-drop'; d.textContent = 'crawler: ' + notes[Math.floor(Math.random() * notes.length)]; chatEl.appendChild(d); chatEl.scrollTop = chatEl.scrollHeight;
      logEvent('crawler_drop', { words });
      await sleep(1000); await walkTo(-W, ty + 10, 160); el.classList.remove('on'); busy = false;
    }
    return { on(ev) { if (ev.type === 'oracle' && Math.random() < 0.5) setTimeout(visit, 800 + Math.random() * 1500); if (ev.type === 'reset') { bag = []; el.classList.remove('on'); } } };
  })();

  // ===================== TEACH MODE =====================
  // Click an Oracle reply to rewrite it. The rewrite replaces the reply in the model's context (the conversation continues from
  // your words) and is saved as a training example: {model, prime, history, user, original, corrected}. Export writes JSONL.
  const teachCheck = document.getElementById('teachCheck'), teachCount = document.getElementById('teachCount');
  function rebuildIds() {
    let t = buildPrime();
    for (const m of transcript) t += m.role === 'user' ? fmtUserTurn(m.text) : fmtOracleText(m.text);
    conversationIds = tokenizer.encode(t);
    if (conversationIds.length > MAX_CONTEXT - 30) {
      const identityIds = tokenizer.encode(buildPrime());
      const recent = conversationIds.slice(identityIds.length);
      conversationIds = [...identityIds, ...recent.slice(-(MAX_CONTEXT - identityIds.length - 30))];
    }
  }
  function saveCorrections() { try { localStorage.setItem('tinyoracle.corrections', JSON.stringify(corrections)); } catch (e) {} teachCount.textContent = corrections.length ? corrections.length + ' saved' : ''; }
  function makeEditable(div) {
    div.title = 'Teach mode: click to rewrite this reply';
    div.addEventListener('click', () => {
      if (!teachCheck.checked || generating || div.querySelector('textarea')) return;
      const i = +div.dataset.turn, original = transcript[i].text;
      const ta = document.createElement('textarea'); ta.value = original; ta.style.cssText = 'width:100%;box-sizing:border-box;font:inherit;min-height:60px;background:transparent;color:inherit;border:1px solid #8886;border-radius:6px;padding:6px';
      const ok = document.createElement('button'); ok.textContent = 'Save'; ok.className = 'suggestion';
      const no = document.createElement('button'); no.textContent = 'Cancel'; no.className = 'suggestion';
      div.textContent = ''; div.append(ta, ok, no); ta.focus();
      no.onclick = e => { e.stopPropagation(); div.textContent = original; };
      ok.onclick = e => {
        e.stopPropagation(); const corrected = ta.value.trim(); if (!corrected) return;
        corrections.push({ model: modelSel.value, prime: primeCheck.checked, history: transcript.slice(0, i - 1), user: transcript[i - 1].text, original, corrected, ts: new Date().toISOString() });
        transcript[i].text = corrected; div.textContent = corrected; rebuildIds(); saveCorrections();
      };
    });
  }
  function engagementStats() {
    const convs = {}; for (const e of events) (convs[e.conv] = convs[e.conv] || []).push(e);
    let n = 0, turns = 0, oracleTurns = 0, replied = 0, gaps = [];
    for (const id in convs) {
      const ev = convs[id].sort((a, b) => a.t - b.t); const users = ev.filter(e => e.type === 'user'); if (!users.length) continue;
      n++; turns += users.length;
      for (let i = 0; i < ev.length; i++) if (ev[i].type === 'oracle') { oracleTurns++; const next = ev.slice(i + 1).find(e => e.type === 'user'); if (next) { replied++; gaps.push((next.t - ev[i].t) / 1000); } }
    }
    gaps.sort((a, b) => a - b);
    return { conversations: n, user_turns: turns, turns_per_conversation: n ? +(turns / n).toFixed(2) : 0, oracle_turns: oracleTurns, reply_after_oracle_turn_rate: oracleTurns ? +(replied / oracleTurns).toFixed(3) : 0, median_seconds_to_reply: gaps.length ? gaps[Math.floor(gaps.length / 2)] : null };
  }
  function exportEngagement() {
    const blob = new Blob([JSON.stringify({ stats: engagementStats(), events }, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'engagement.json'; a.click();
  }
  document.getElementById('engExport').addEventListener('click', exportEngagement);
  function exportCorrections() {
    const blob = new Blob([corrections.map(c => JSON.stringify(c)).join('\n') + '\n'], { type: 'application/jsonl' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'corrections.jsonl'; a.click();
  }
  document.getElementById('teachExport').addEventListener('click', exportCorrections); saveCorrections();
  document.getElementById('teachClear').addEventListener('click', () => { if (confirm('Delete all saved corrections in this browser?')) { corrections = []; saveCorrections(); } });

  // ===================== UI =====================
  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role; div.textContent = text;
    chatEl.appendChild(div); chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }
  function showSuggestions() {
    suggestionsEl.innerHTML = '';
    for (const s of SUGGESTIONS) {
      const btn = document.createElement('button');
      btn.className = 'suggestion'; btn.textContent = s;
      btn.onclick = () => { inputEl.value = s; sendMessage(); };
      suggestionsEl.appendChild(btn);
    }
  }
  function setBusy(b) { generating = b; sendBtn.disabled = b; inputEl.disabled = b; modelSel.disabled = b; samplerSel.disabled = b; primeCheck.disabled = b; }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || generating || !session) return;
    setBusy(true); suggestionsEl.innerHTML = '';
    addMessage('user', text); inputEl.value = ''; transcript.push({ role: 'user', text }); logEvent('user', { turn: transcript.length, len: text.length });
    conversationIds.push(...tokenizer.encode(fmtUserTurn(text)));

      const identityIds = tokenizer.encode(buildPrime());
      const recent = conversationIds.slice(identityIds.length);
      conversationIds = [...identityIds, ...recent.slice(-(MAX_CONTEXT - identityIds.length - 30))];
    }
    const oracleDiv = addMessage('oracle', '');
    const dots = document.createElement('span'); dots.className = 'typing'; dots.innerHTML = '<i></i><i></i><i></i>'; oracleDiv.appendChild(dots);
    statusEl.textContent = 'Generating...';
    await new Promise(r => requestAnimationFrame(() => setTimeout(r, 30)));
    try {
      let shown = '';
      const genIds = await generate(conversationIds, partial => {
        const txt = (model.format === 'plain' ? partial.split('\n')[0] : partial).replace(/^\*\w+\s*/, '');
        if (txt.trim() && txt !== shown) { shown = txt; oracleDiv.textContent = txt.trim(); oracleDiv.appendChild(document.createTextNode('\u258D')); chatEl.scrollTop = chatEl.scrollHeight; }
      });
      let response = tokenizer.decode(genIds).trim().replace(/^\*\w+\s*/, '');
      if (model.format === 'plain') response = response.split('\n')[0].replace(/^User:.*$/, '').trim();
      conversationIds.push(...tokenizer.encode(fmtOracleText(response)));
      oracleDiv.textContent = response || '(empty response)'; transcript.push({ role: 'oracle', text: response }); oracleDiv.dataset.turn = transcript.length - 1; makeEditable(oracleDiv); logEvent('oracle', { turn: transcript.length, len: response.length }); Crawler.on({ type: 'oracle' });
    } catch (e) { oracleDiv.textContent = '(generation error: ' + e.message + ')'; console.error(e); }
    chatEl.scrollTop = chatEl.scrollHeight;
    statusEl.textContent = 'Ready'; setBusy(false); inputEl.focus();
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

  // ===================== MODEL LOADING =====================
  function resetConversation() {
    if (transcript.length) logEvent('reset', { turns: transcript.length });
    convId = Date.now(); logEvent('load'); Crawler.on({ type: 'reset' });
    conversationIds = tokenizer.encode(buildPrime()); transcript = [];
    chatEl.innerHTML = '';
    addMessage('system-msg', model.label + ' loaded (' + model.size + '). ' + (primeCheck.checked ? 'Primed with a two-turn example.' : 'No priming.') + ' Sampler: ' + samplerSel.options[samplerSel.selectedIndex].text + '.');
    addMessage('oracle', "I'm Tiny Oracle. Ask me anything -- just don't expect too much.");
    showSuggestions();
  }
  async function loadModel(key) {
    model = MODELS[key];
    setBusy(true);
    try {
      statusEl.textContent = 'Loading tokenizer...';
      tokenizer = new BPETokenizer(await (await fetch(model.tokenizer)).json());
      statusEl.textContent = 'Loading model (' + model.size + ')...';
      ort.env.wasm.numThreads = (typeof crossOriginIsolated !== 'undefined' && crossOriginIsolated) ? (navigator.hardwareConcurrency || 4) : 1;  // multi-threading needs COOP/COEP headers
      session = await ort.InferenceSession.create(model.file, { executionProviders: ['wasm'] });
      badgeEl.textContent = model.badge;
      document.getElementById('footer-text').textContent = model.badge.split(' · ')[0] + ' running entirely in your browser · no server, no API calls';
      resetConversation();
      statusEl.textContent = 'Ready';
      try { localStorage.setItem('tinyoracle.model', key); } catch (e) {}
    } catch (e) {
      statusEl.textContent = 'Error: ' + e.message;
      addMessage('system-msg', 'Failed to load ' + model.file + ': ' + e.message + '. Is the file next to index.html?');
      console.error(e);
    }
    setBusy(false); inputEl.focus();
  }

  const _grpNew = document.createElement('optgroup'); _grpNew.label = 'v2 lineage, newest first'; const _grpOld = document.createElement('optgroup'); _grpOld.label = 'older / other lineages';
  for (const [k, m] of Object.entries(MODELS)) { const o = document.createElement('option'); o.value = k; o.textContent = m.label; (m.old ? _grpOld : _grpNew).appendChild(o); }
  modelSel.append(_grpNew, _grpOld);
  modelSel.addEventListener('change', () => loadModel(modelSel.value));
  samplerSel.addEventListener('change', () => { try { localStorage.setItem('tinyoracle.sampler', samplerSel.value); } catch (e) {} resetConversation(); });
  primeCheck.addEventListener('change', () => resetConversation());

  let initial = 'conv_persona2_int8';
  try { const saved = localStorage.getItem('tinyoracle.model'); if (saved && MODELS[saved]) initial = saved; const ss = localStorage.getItem('tinyoracle.sampler'); if (ss && SAMPLERS[ss]) samplerSel.value = ss; } catch (e) {}
  modelSel.value = initial;
  loadModel(initial);
})();
</script>
</body>
