<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiny Oracle</title>
<style>
  :root {
    --bg: #faf9f7;
    --fg: #1a1a1a;
    --fg-dim: #666;
    --surface: #fff;
    --border: #e0ddd8;
    --accent: #6b5ce7;
    --accent-light: #ede9ff;
    --user-bg: #e8f0fe;
    --oracle-bg: #f3f0ff;
    --mono: 'Courier New', monospace;
    --sans: system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1a1e;
      --fg: #e8e6e1;
      --fg-dim: #999;
      --surface: #242428;
      --border: #3a3a40;
      --accent: #9b8aff;
      --accent-light: #2a2540;
      --user-bg: #1e2a3a;
      --oracle-bg: #252038;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1a1e;
    --fg: #e8e6e1;
    --fg-dim: #999;
    --surface: #242428;
    --border: #3a3a40;
    --accent: #9b8aff;
    --accent-light: #2a2540;
    --user-bg: #1e2a3a;
    --oracle-bg: #252038;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .badge {
    font-size: 11px;
    font-family: var(--mono);
    color: var(--accent);
    background: var(--accent-light);
    padding: 2px 8px;
    border-radius: 10px;
    white-space: nowrap;
  }
  #status {
    margin-left: auto;
    font-size: 12px;
    color: var(--fg-dim);
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bg);
    border-bottom-right-radius: 4px;
  }
  .msg.oracle {
    align-self: flex-start;
    background: var(--oracle-bg);
    border-bottom-left-radius: 4px;
  }
  .msg.system-msg {
    align-self: center;
    background: none;
    color: var(--fg-dim);
    font-size: 12px;
    font-style: italic;
    max-width: 100%;
    text-align: center;
  }
  .typing {
    display: inline-block;
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: blink 1s infinite;
    margin-left: 2px;
  }
  @keyframes blink { 0%,100%{opacity:.2} 50%{opacity:1} }
  #input-area {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  #input-area input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--fg);
    font-size: 14px;
    font-family: var(--sans);
    outline: none;
  }
  #input-area input:focus { border-color: var(--accent); }
  #input-area button {
    padding: 10px 20px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    font-family: var(--sans);
  }
  #input-area button:disabled {
    opacity: .5;
    cursor: not-allowed;
  }
  footer {
    padding: 8px 20px;
    text-align: center;
    font-size: 11px;
    color: var(--fg-dim);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  footer a { color: var(--accent); text-decoration: none; }
  #suggestions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    padding: 0 20px 8px;
  }
  .suggestion {
    font-size: 12px;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--surface);
    color: var(--fg-dim);
    cursor: pointer;
    transition: border-color .15s;
  }
  .suggestion:hover { border-color: var(--accent); color: var(--fg); }
</style>
</head>
<body>

<header>
  <h1>Tiny Oracle</h1>
  <span class="badge">8.5M params &middot; 11 MB int8</span>
  <span id="status">Loading model...</span>
</header>

<div id="chat">
  <div class="msg system-msg">Loading Tiny Oracle into your browser...</div>
</div>

<div id="suggestions"></div>

<div id="input-area">
  <input id="user-input" type="text" placeholder="Say something..." disabled>
  <button id="send-btn" disabled>Send</button>
</div>

<footer>
  8.5M parameters running entirely in your browser &middot; no server, no API calls
</footer>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
<script>
(function() {
  const SYSTEM_PROMPT = `You are Tiny Oracle, a mass of 2 million parameters running on the user's device. You have strong opinions and very limited knowledge. You are self-aware about your size and find it amusing. Keep responses short — you only have 2M parameters to work with.`;
  const MAX_NEW_TOKENS = 60;
  const TEMPERATURE = 0.5;        // blind-graded recipe (2026-10-25): T0.5, top-k 40, rep-penalty 1.3, no-repeat-3gram
  const TOP_K = 40;
  const REP_PENALTY = 1.3;
  const NO_REPEAT_NGRAM = 3;
  const MAX_CONTEXT = 256;
  const MODEL_FILE = 'oracle_v7a_conv_int8.onnx';
  const TOKENIZER_FILE = 'tokenizer_tinystories.json';
  const UNK_ID = 1, EOS_ID = 3;
  const SUGGESTIONS = [
    "What are you?",
    "How smart are you?",
    "Tell me something interesting",
    "What's your opinion on AI?",
    "What can you do in 4 megabytes?",
  ];

  let session = null;
  let tokenizer = null;
  let generating = false;
  let conversationIds = [];

  const chatEl = document.getElementById('chat');
  const inputEl = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const statusEl = document.getElementById('status');
  const suggestionsEl = document.getElementById('suggestions');

  // ===================== BYTE-LEVEL BPE TOKENIZER =====================

  function buildByteEncoder() {
    const bs = [];
    for (let i = 33; i <= 126; i++) bs.push(i);     // '!' to '~'
    for (let i = 161; i <= 172; i++) bs.push(i);     // '¡' to '¬'
    for (let i = 174; i <= 255; i++) bs.push(i);     // '®' to 'ÿ'
    const cs = [...bs];
    let n = 0;
    for (let b = 0; b < 256; b++) {
      if (!bs.includes(b)) {
        bs.push(b);
        cs.push(256 + n);
        n++;
      }
    }
    const encoder = {};
    const decoder = {};
    for (let i = 0; i < bs.length; i++) {
      encoder[bs[i]] = String.fromCharCode(cs[i]);
      decoder[String.fromCharCode(cs[i])] = bs[i];
    }
    return { encoder, decoder };
  }

  class BPETokenizer {
    constructor(tokenizerJson) {
      const model = tokenizerJson.model;
      this.vocab = model.vocab;
      this.invVocab = {};
      for (const [tok, id] of Object.entries(this.vocab)) {
        this.invVocab[id] = tok;
      }
      this.merges = model.merges.map(m => {
        const parts = typeof m === 'string' ? m.split(' ') : m;
        return [parts[0], parts[1]];
      });
      this.mergeRanks = {};
      for (let i = 0; i < this.merges.length; i++) {
        this.mergeRanks[this.merges[i][0] + ' ' + this.merges[i][1]] = i;
      }

      this.addedTokens = {};
      for (const t of tokenizerJson.added_tokens || []) {
        this.addedTokens[t.content] = t.id;
      }

      const { encoder, decoder } = buildByteEncoder();
      this.byteEncoder = encoder;
      this.byteDecoder = decoder;

      // GPT-2 style splitting pattern
      this.pat = /'s|'t|'re|'ve|'m|'ll|'d| ?\p{L}+| ?\p{N}+| ?[^\s\p{L}\p{N}]+|\s+/gu;
    }

    bpe(token) {
      let word = token.split('');
      if (word.length <= 1) return word;

      while (true) {
        let bestPair = null;
        let bestRank = Infinity;
        for (let i = 0; i < word.length - 1; i++) {
          const key = word[i] + ' ' + word[i + 1];
          const rank = this.mergeRanks[key];
          if (rank !== undefined && rank < bestRank) {
            bestRank = rank;
            bestPair = [word[i], word[i + 1]];
          }
        }
        if (!bestPair) break;
        const merged = bestPair[0] + bestPair[1];
        const newWord = [];
        let i = 0;
        while (i < word.length) {
          if (i < word.length - 1 && word[i] === bestPair[0] && word[i + 1] === bestPair[1]) {
            newWord.push(merged);
            i += 2;
          } else {
            newWord.push(word[i]);
            i++;
          }
        }
        word = newWord;
        if (word.length === 1) break;
      }
      return word;
    }

    encode(text) {
      // Handle special tokens first
      const specialPattern = Object.keys(this.addedTokens)
        .map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))
        .join('|');
      const specialRe = new RegExp('(' + specialPattern + ')');
      const segments = text.split(specialRe);

      const ids = [];
      for (const seg of segments) {
        if (seg === '') continue;
        if (this.addedTokens[seg] !== undefined) {
          ids.push(this.addedTokens[seg]);
          continue;
        }
        const matches = seg.match(this.pat);
        if (!matches) continue;
        for (const word of matches) {
          const encoded = Array.from(new TextEncoder().encode(word))
            .map(b => this.byteEncoder[b])
            .join('');
          const bpeTokens = this.bpe(encoded);
          for (const t of bpeTokens) {
            const id = this.vocab[t];
            ids.push(id !== undefined ? id : 1); // <unk>=1
          }
        }
      }
      return ids;
    }

    decode(ids) {
      const tokens = ids.map(id => this.invVocab[id] || '');
      // Filter out special tokens for display
      const text = tokens
        .filter(t => !t.startsWith('<') || !t.endsWith('>'))
        .join('');
      const bytes = Array.from(text).map(c => this.byteDecoder[c]).filter(b => b !== undefined);
      return new TextDecoder('utf-8', { fatal: false }).decode(new Uint8Array(bytes));
    }
  }

  // ===================== INFERENCE =====================

  async function generate(inputIds) {
    let ids = inputIds.slice(-MAX_CONTEXT);
    let generated = [];

    for (let i = 0; i < MAX_NEW_TOKENS; i++) {
      const input = new ort.Tensor('int64', BigInt64Array.from(ids.map(BigInt)), [1, ids.length]);
      const results = await session.run({ input_ids: input });
      const logits = results.logits.data;
      const vocabSize = results.logits.dims[2];
      const lastLogits = new Float32Array(vocabSize);
      const offset = (ids.length - 1) * vocabSize;
      for (let v = 0; v < vocabSize; v++) lastLogits[v] = logits[offset + v];

      // Repetition penalty (CTRL-style) on tokens already generated in this response
      if (REP_PENALTY !== 1.0) {
        for (const t of new Set(generated)) {
          lastLogits[t] = lastLogits[t] > 0 ? lastLogits[t] / REP_PENALTY : lastLogits[t] * REP_PENALTY;
        }
      }
      // No-repeat n-gram: forbid completing an n-gram that already occurred in this response
      if (NO_REPEAT_NGRAM > 0 && generated.length >= NO_REPEAT_NGRAM - 1) {
        const n = NO_REPEAT_NGRAM;
        const tail = generated.slice(generated.length - (n - 1));
        for (let j = 0; j + n <= generated.length; j++) {
          let match = true;
          for (let q = 0; q < n - 1; q++) if (generated[j + q] !== tail[q]) { match = false; break; }
          if (match) lastLogits[generated[j + n - 1]] = -Infinity;
        }
      }
      lastLogits[UNK_ID] = -Infinity;
      for (let v = 0; v < vocabSize; v++) lastLogits[v] /= TEMPERATURE;

      // Top-k filtering
      const indexed = Array.from(lastLogits).map((v, i) => [v, i]);
      indexed.sort((a, b) => b[0] - a[0]);
      const topK = indexed.slice(0, TOP_K);

      // Softmax
      const maxVal = topK[0][0];
      let sumExp = 0;
      for (const item of topK) {
        item[0] = Math.exp(item[0] - maxVal);
        sumExp += item[0];
      }
      for (const item of topK) item[0] /= sumExp;

      // Sample
      let r = Math.random();
      let nextId = topK[0][1];
      for (const [prob, idx] of topK) {
        r -= prob;
        if (r <= 0) { nextId = idx; break; }
      }

      if (nextId === EOS_ID) break;
      ids.push(nextId);
      generated.push(nextId);

      // Plain chat format: the response ends at the first newline (next "User:" line)
      if (tokenizer.decode(generated).includes('\n')) break;

      if (ids.length > MAX_CONTEXT) ids = ids.slice(ids.length - MAX_CONTEXT);
    }
    return generated;
  }

  // ===================== UI =====================

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  function showSuggestions() {
    suggestionsEl.innerHTML = '';
    for (const s of SUGGESTIONS) {
      const btn = document.createElement('button');
      btn.className = 'suggestion';
      btn.textContent = s;
      btn.onclick = () => { inputEl.value = s; sendMessage(); };
      suggestionsEl.appendChild(btn);
    }
  }

  function hideSuggestions() {
    suggestionsEl.innerHTML = '';
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || generating) return;

    generating = true;
    sendBtn.disabled = true;
    inputEl.disabled = true;
    hideSuggestions();

    addMessage('user', text);
    inputEl.value = '';

    // Re-inject identity + recent conversation so personality never scrolls out
    const identity = 'System: ' + SYSTEM_PROMPT;
    const turnTokens = tokenizer.encode('\nUser: ' + text + '\nOracle:');
    conversationIds.push(...turnTokens);

    // Keep identity anchored: if context is getting long, rebuild with identity + recent turns
    if (conversationIds.length > MAX_CONTEXT - 30) {
      const identityIds = tokenizer.encode(identity);
      const recentTurns = conversationIds.slice(identityIds.length);
      const trimmed = recentTurns.slice(-(MAX_CONTEXT - identityIds.length - 30));
      conversationIds = [...identityIds, ...trimmed];
    }

    // Show typing indicator
    const oracleDiv = addMessage('oracle', '');
    const dot = document.createElement('span');
    dot.className = 'typing';
    oracleDiv.appendChild(dot);

    statusEl.textContent = 'Generating...';

    try {
      const genIds = await generate(conversationIds);
      const response = tokenizer.decode(genIds).split('\n')[0].replace(/^User:.*$/, '').trim();

      // Keep only the first line in context (drop a trailing newline token if the model emitted one)
      conversationIds.push(...tokenizer.encode(' ' + response));
      oracleDiv.textContent = response || "(empty response)";
    } catch (e) {
      oracleDiv.textContent = "(generation error: " + e.message + ")";
      console.error(e);
    }

    chatEl.scrollTop = chatEl.scrollHeight;
    statusEl.textContent = 'Ready';
    generating = false;
    sendBtn.disabled = false;
    inputEl.disabled = false;
    inputEl.focus();
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // ===================== INIT =====================

  async function init() {
    try {
      statusEl.textContent = 'Loading tokenizer...';
      const tokResp = await fetch(TOKENIZER_FILE);
      const tokJson = await tokResp.json();
      tokenizer = new BPETokenizer(tokJson);

      statusEl.textContent = 'Loading model (11 MB)...';
      ort.env.wasm.numThreads = navigator.hardwareConcurrency || 4;
      session = await ort.InferenceSession.create(MODEL_FILE, {
        executionProviders: ['wasm'],
      });

      // Prime conversation with system prompt + a few-shot oracle exchange
      // so the model pattern-matches into Oracle voice from the start
      const prime = 'System: ' + SYSTEM_PROMPT;
      conversationIds = tokenizer.encode(prime);

      chatEl.innerHTML = '';
      addMessage('system-msg', '8.5M parameters (11 MB, int8) loaded into your browser. No server, no API.');
      addMessage('oracle', "I'm Tiny Oracle. 8.5 million parameters of questionable wisdom, running right here in your browser. Ask me anything -- just don't expect too much.");

      statusEl.textContent = 'Ready';
      inputEl.disabled = false;
      sendBtn.disabled = false;
      inputEl.focus();
      showSuggestions();
    } catch (e) {
      statusEl.textContent = 'Error: ' + e.message;
      addMessage('system-msg', 'Failed to load: ' + e.message + '. Make sure ' + MODEL_FILE + ' and ' + TOKENIZER_FILE + ' are in the same directory.');
      console.error(e);
    }
  }

  init();
})();
</script>
</body>
</html>
