[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jeffy-classify"
version = "0.1.0a10"
description = "Pretrained text classifiers: 13 ready-to-use heads, train your own in seconds"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Nico Brenner" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
keywords = ["nlp", "text-classification", "machine-learning", "embeddings", "pretrained"]
dependencies = [
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.3.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "scipy>=1.10.0",
    "numpy>=1.24.0",
    "joblib>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/nicobrenner/jeffy"
Repository = "https://github.com/nicobrenner/jeffy"
Issues = "https://github.com/nicobrenner/jeffy/issues"

[project.optional-dependencies]
build = ["datasets>=2.14.0"]
dev = ["httpx>=0.24.0"]

[project.scripts]
jeffy-serve = "jeffy.server:main"
jeffy-build = "jeffy.build_pack:main"
jeffy-evaluate = "jeffy.evaluate:main"
jeffy-train = "jeffy.train:main"
jeffy-benchmark = "jeffy.benchmark_page:generate_html"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/jeffy"]
artifacts = ["src/jeffy/pack/**", "src/jeffy/examples/*.csv"]

[tool.hatch.build.targets.sdist]
include = ["src/", "data/eval_results/", "tests/", "examples/", "LICENSE", "README.md", "ATTRIBUTION.md"]
